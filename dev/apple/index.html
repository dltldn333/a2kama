<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Apple 디자인을 웹의 기본 기술로 재해석하는 인터랙티브 레이아웃 실험."
    />
    <meta name="codex-preview" content="development" />
    <title>Vanilla Apple Lab</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script src="./vendor/gsap.min.js" defer></script>
    <script src="./vendor/lenis.min.js" defer></script>
    <script type="module" src="./src/a2kama.js"></script>
    <script src="./src/main.js" defer></script>
  </head>
  <body>
    <div id="frame">
      <div id="root">
        <main class="showcase">
          <div class="showcase-content">
            <div class="unlock-stage">
              <section
                class="showcase-page siri-page layout-only-page"
                id="siri"
                aria-label="Siri 콘텐츠 레이아웃"
              >
                <div class="siri-output">
                  <div class="bg-grid-container">
                    <div class="bg-grid">
                      <div class="bg-item">
                        <img src="src/test.png" alt="Cover" />
                        <div class="bg-item-text">
                          <div class="bg-item-title">Podcast 1</div>
                          <div class="bg-item-subtitle">Wondery</div>
                        </div>
                      </div>
                      <div class="bg-item">
                        <img src="src/test.png" alt="Cover" />
                        <div class="bg-item-text">
                          <div class="bg-item-title">Podcast 2</div>
                          <div class="bg-item-subtitle">SmartLess</div>
                        </div>
                      </div>
                      <div class="bg-item">
                        <img src="src/test.png" alt="Cover" />
                        <div class="bg-item-text">
                          <div class="bg-item-title">Podcast 3</div>
                          <div class="bg-item-subtitle">Crime Junkie</div>
                        </div>
                      </div>
                      <div class="bg-item">
                        <img src="src/test.png" alt="Cover" />
                        <div class="bg-item-text">
                          <div class="bg-item-title">Podcast 4</div>
                          <div class="bg-item-subtitle">The Daily</div>
                        </div>
                      </div>
                    </div>
                  </div>
                 <div class="dynamic-island">
                  <span></span>
                 </div>
                 <div class="siri-circle"></div>
                </div>
              </section>
            </div>

            <section
              class="showcase-page glass-page"
              id="glass"
              data-page="glass"
              data-glass-scene
              aria-labelledby="glass-title"
            >
              <div class="glass-output">
                <div class="bg-grid-container">
                  <div class="bg-grid">
                    <div class="bg-item">
                      <img src="src/test.png" alt="Cover" />
                      <div class="bg-item-text">
                        <div class="bg-item-title">Podcast 1</div>
                        <div class="bg-item-subtitle">Wondery</div>
                      </div>
                    </div>
                    <div class="bg-item">
                      <img src="src/test.png" alt="Cover" />
                      <div class="bg-item-text">
                        <div class="bg-item-title">Podcast 2</div>
                        <div class="bg-item-subtitle">SmartLess</div>
                      </div>
                    </div>
                    <div class="bg-item">
                      <img src="src/test.png" alt="Cover" />
                      <div class="bg-item-text">
                        <div class="bg-item-title">Podcast 3</div>
                        <div class="bg-item-subtitle">Crime Junkie</div>
                      </div>
                    </div>
                    <div class="bg-item">
                      <img src="src/test.png" alt="Cover" />
                      <div class="bg-item-text">
                        <div class="bg-item-title">Podcast 4</div>
                        <div class="bg-item-subtitle">The Daily</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="glass-dock-dummy">
                  <div class="dummy-highlight"></div>
                  <div class="dummy-buttons">
                    <div class="dummy-btn active">
                      <svg
                        class="dummy-icon"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                      >
                        <path d="M12 3L3 10h2v11h5v-7h4v7h5V10h2L12 3z" />
                      </svg>
                      <span>Home</span>
                    </div>
                    <div class="dummy-btn">
                      <svg
                        class="dummy-icon"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                      >
                        <rect x="4" y="4" width="6" height="6" rx="1.5" />
                        <rect x="14" y="4" width="6" height="6" rx="1.5" />
                        <rect x="4" y="14" width="6" height="6" rx="1.5" />
                        <rect x="14" y="14" width="6" height="6" rx="1.5" />
                      </svg>
                      <span>New</span>
                    </div>
                    <div class="dummy-btn">
                      <svg
                        class="dummy-icon"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                      >
                        <rect x="7" y="3" width="10" height="2" rx="1" />
                        <rect x="5" y="6" width="14" height="2" rx="1" />
                        <rect x="3" y="9" width="18" height="13" rx="3" />
                        <circle cx="12" cy="17" r="1.5" fill="white" />
                        <path
                          d="M9.5 14.5a3.5 3.5 0 0 1 5 0"
                          fill="none"
                          stroke="white"
                          stroke-width="1.5"
                          stroke-linecap="round"
                        />
                      </svg>
                      <span>Library</span>
                    </div>
                    <div class="dummy-btn">
                      <svg
                        class="dummy-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <circle cx="11" cy="11" r="6" />
                        <path d="M20 20l-4.5-4.5" />
                      </svg>
                      <span>Search</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="slider-wrap">
                <img src="src/svg/Slide0.svg" alt="" />
                <div
                  class="div-slider light-slider liquid-slider"
                  data-range="glass-opacity"
                  data-min="-100"
                  data-max="100"
                  data-value="0"
                  role="slider"
                  tabindex="0"
                  aria-label="Glass 배경 투명도"
                  aria-valuemin="-100"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <div class="slider-track">
                    <div class="slider-fill"></div>
                    <div class="slider-thumb"></div>
                  </div>
                </div>
                <img src="src/svg/Slide1.svg" alt="" />
              </div>
            </section>

            <section
              class="showcase-page navigation-page layout-only-page"
              id="navigation"
              data-page="navigation"
              aria-label="Navigation 콘텐츠 레이아웃"
            >
              <div class="layout-grid layout-grid-navigation">
                <div class="layout-slot layout-copy-slot">
                  <!-- Navigation 제목과 설명을 입력하세요. -->
                </div>
                <div class="layout-window-slot">
                  <div class="layout-sidebar-slot"><!-- 사이드 콘텐츠 --></div>
                  <div class="layout-main-slot">
                    <div class="layout-wide-card"><!-- 주요 콘텐츠 --></div>
                    <div class="layout-small-card-row">
                      <div></div>
                      <div></div>
                      <div></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section
              class="showcase-page controls-page layout-only-page"
              id="controls"
              data-page="controls"
              aria-label="Controls 콘텐츠 레이아웃"
            >
              <div class="layout-grid layout-grid-controls">
                <div class="layout-slot layout-copy-slot">
                  <!-- Controls 제목과 설명을 입력하세요. -->
                </div>
                <div class="layout-card-grid">
                  <div class="layout-card"><!-- 컴포넌트 1 --></div>
                  <div class="layout-card"><!-- 컴포넌트 2 --></div>
                  <div class="layout-card"><!-- 컴포넌트 3 --></div>
                  <div class="layout-card"><!-- 컴포넌트 4 --></div>
                </div>
              </div>
            </section>

            <section
              class="showcase-page feedback-page layout-only-page"
              id="feedback"
              data-page="feedback"
              aria-label="Feedback 콘텐츠 레이아웃"
            >
              <div class="layout-grid layout-grid-feedback">
                <div class="layout-slot layout-copy-slot">
                  <!-- Feedback 제목과 설명을 입력하세요. -->
                </div>
                <div class="layout-device-slot"><!-- 큰 시각 콘텐츠 --></div>
                <div class="layout-stack-slot">
                  <div><!-- 보조 콘텐츠 1 --></div>
                  <div><!-- 보조 콘텐츠 2 --></div>
                  <div><!-- 보조 콘텐츠 3 --></div>
                </div>
              </div>
            </section>
          </div>
        </main>

        <nav
          data-a2kama="dockGlass"
          data-mirage-travel="traveler 3"
          data-mirage-select="include-tree"
          class="bottom-dock"
          data-dock
          aria-label="페이지 내비게이션. 선택된 항목을 좌우로 끌어 이동할 수 있습니다."
        >
          <span
            data-a2kama="dockBtnGlass"
            data-mirage-travel="traveler 4"
            class="dock-highlight"
            data-dock-highlight
            aria-hidden="true"
            style="z-index: 20"
          ></span>
          <div class="dock-buttons-group" style="z-index: 11">
            <button
              type="button"
              data-page-target="siri"
              aria-label="Siri 페이지"
            >
              <span class="dock-icon dock-icon-siri">✦</span><small>Siri</small>
            </button>
            <button
              type="button"
              data-page-target="glass"
              aria-label="Glass 페이지"
            >
              <span class="dock-icon dock-icon-glass">◐</span
              ><small>Glass</small>
            </button>
            <button
              type="button"
              data-page-target="navigation"
              aria-label="Navigate 페이지"
            >
              <span class="dock-icon dock-icon-navigation">≡</span
              ><small>Navigate</small>
            </button>
            <button
              type="button"
              data-page-target="controls"
              aria-label="Controls 페이지"
            >
              <span class="dock-icon dock-icon-controls">⌁</span
              ><small>Controls</small>
            </button>
            <button
              type="button"
              data-page-target="feedback"
              aria-label="Feedback 페이지"
            >
              <span class="dock-icon dock-icon-feedback">●</span
              ><small>Feedback</small>
            </button>
          </div>
        </nav>

        <div
          class="lock-screen"
          role="dialog"
          aria-modal="true"
          aria-label="첫 화면. 위로 밀어서 시작하세요."
        >
          <div class="lock-background" aria-hidden="true">
            <div class="wallpaper">
              <img
                class="wallpaper-front"
                style="
                  position: absolute;
                  width: 100%;
                  top: 0;
                  left: 0;
                  height: 100%;
                  object-fit: cover;
                  z-index: 1;
                "
                src="./src/front.png"
              />
              <img
                class="wallpaper-back"
                style="
                  position: absolute;
                  width: 100%;
                  top: 0;
                  left: 0;
                  height: 100%;
                  object-fit: cover;
                "
                src="./src/test.png"
              />
            </div>
          </div>
          <div
            class="lock-interface"
            data-a2kama="lockGlass"
            data-mirage-travel="traveler 5"
            data-mirage-select="include-self"
          >
            <div
              data-mirage-sandwich="front"
              data-mirage-filter="end"
              style="width: 100%; height: 100%"
            >
              <time class="lock-time" data-lock-time datetime=""></time>
              <!-- 첫 화면 콘텐츠를 넣을 수 있는 빈 영역입니다. -->
              <button class="unlock-hint" type="button" data-unlock>
                <span>위로 밀어서 시작하기</span>
                <i></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
